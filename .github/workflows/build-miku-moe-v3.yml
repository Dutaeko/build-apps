name: Build Miku Moe v3

on:
  pull_request:
    branches:
      - global
    paths:
      - miku-moe-v3/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          git fetch origin agent/miku-moe-v2-build --depth=1
          git checkout FETCH_HEAD -- miku-moe-v2
          cat miku-moe-v2/source.part.00 miku-moe-v2/source.part.01 > source.tar.gz.b64
          head -c 1222 miku-moe-v2/source.part.02 >> source.tar.gz.b64
          tail -c +1224 miku-moe-v2/source.part.02 >> source.tar.gz.b64
          head -c 6703 miku-moe-v2/source.part.03 >> source.tar.gz.b64
          cat miku-moe-v2/source.part.03.tail >> source.tar.gz.b64
          cat miku-moe-v2/source.part.04 >> source.tar.gz.b64
          base64 --decode source.tar.gz.b64 > source.tar.gz
          echo "05eb7ff51a9ad6db584ffeef08e3d3df5a7fe969e9663326e6d3314cb079f433  source.tar.gz" | sha256sum --check
          tar -xzf source.tar.gz
          cat miku-moe-v3/patch.part.* > changes.patch.gz.b64
          base64 --decode changes.patch.gz.b64 > changes.patch.gz
          gzip -dc changes.patch.gz > changes.patch
          patch --batch -p2 < changes.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Generate release key
        run: keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass miku1234 -alias miku -keypass miku1234 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Miku Moe v2, OU=Android, O=Dutaeko, L=Jakarta, ST=Jakarta, C=ID" > /dev/null
      - name: Build APK files
        id: build
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: miku1234
          RELEASE_KEY_ALIAS: miku
          RELEASE_KEY_PASSWORD: miku1234
        run: |
          code=0
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > build.log 2>&1 || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MikuMoe-v3-build-log
          path: build.log
          if-no-files-found: error
      - name: Report build failure
        if: steps.build.outputs.exit_code != '0'
        run: |
          tail -n 300 build.log
          exit 1
      - name: Collect APK files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MikuMoe-v3-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/MikuMoe-v3-release.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MikuMoe-v3-apks
          path: dist/*
          if-no-files-found: error
