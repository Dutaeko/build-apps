name: Build Naru Komik v1

on:
  push:
    branches:
      - agent/naru-komik-v1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/naru-komik-v1-build
      - name: Restore source
        run: |
          cat naru-komik-v1/source.part.* > source.tar.gz.b64
          base64 --decode source.tar.gz.b64 > source.tar.gz
          mkdir app-source
          tar -xzf source.tar.gz -C app-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Generate release key
        run: keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass naru1234 -alias naru -keypass naru1234 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Naru Komik, OU=Android, O=Dutaeko, L=Jakarta, ST=Jakarta, C=ID" > /dev/null
      - name: Build APK files
        working-directory: app-source
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: naru1234
          RELEASE_KEY_ALIAS: naru
          RELEASE_KEY_PASSWORD: naru1234
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain
      - name: Publish APK files
        run: |
          mkdir -p naru-komik-v1/dist
          cp app-source/app/build/outputs/apk/debug/app-debug.apk naru-komik-v1/dist/NaruKomik-v1-debug.apk
          cp app-source/app/build/outputs/apk/release/app-release.apk naru-komik-v1/dist/NaruKomik-v1-release.apk
          sha256sum naru-komik-v1/dist/*.apk > naru-komik-v1/dist/SHA256SUMS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add naru-komik-v1/dist
          git commit -m "Publish Naru Komik v1 APK files [skip ci]"
          git push origin HEAD:agent/naru-komik-v1-build
