name: Build Miku Moe v5

on:
  pull_request:
    branches:
      - global
    paths:
      - miku-moe-v5/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        id: restore
        run: |
          code=0
          {
            sha256sum payload-v5/source.part.00 payload-v5/source.part.01 payload-v5/source.part.02 payload-v5/source.part.03 payload-v5/source.part.04a payload-v5/source.part.04b payload-v5/source.part.05 payload-v5/source.part.06 payload-v5/source.part.07 payload-v5/source.part.08 payload-v5/source.part.09
            wc -c payload-v5/source.part.00 payload-v5/source.part.01 payload-v5/source.part.02 payload-v5/source.part.03 payload-v5/source.part.04a payload-v5/source.part.04b payload-v5/source.part.05 payload-v5/source.part.06 payload-v5/source.part.07 payload-v5/source.part.08 payload-v5/source.part.09
            cat payload-v5/source.part.00 payload-v5/source.part.01 payload-v5/source.part.02 payload-v5/source.part.03 payload-v5/source.part.04a payload-v5/source.part.04b payload-v5/source.part.05 payload-v5/source.part.06 payload-v5/source.part.07 payload-v5/source.part.08 payload-v5/source.part.09 > source.tar.gz.b64
            sha256sum source.tar.gz.b64
            wc -c source.tar.gz.b64
            echo "dd6fcbe751b457f80662df870f6d0dab5c5adb20ee51955dcec4dd95fcc70d89  source.tar.gz.b64" | sha256sum --check
            base64 --decode source.tar.gz.b64 > source.tar.gz
            echo "65099ee9377ce671196a5b320074a5e58f8d16f311e4a823ed6374739732f5bb  source.tar.gz" | sha256sum --check
            tar -xzf source.tar.gz
          } > restore.log 2>&1 || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Upload restore log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MikuMoe-v5-restore-log
          path: restore.log
          if-no-files-found: error
      - name: Report restore failure
        if: steps.restore.outputs.exit_code != '0'
        run: |
          cat restore.log
          exit 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Generate release key
        run: keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass miku1234 -alias miku -keypass miku1234 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Miku Moe v2, OU=Android, O=Dutaeko, L=Jakarta, ST=Jakarta, C=ID" > /dev/null
      - name: Build APK files
        id: build
        working-directory: MikuMoe-v5
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: miku1234
          RELEASE_KEY_ALIAS: miku
          RELEASE_KEY_PASSWORD: miku1234
        run: |
          code=0
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > build.log 2>&1 || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MikuMoe-v5-build-log
          path: MikuMoe-v5/build.log
          if-no-files-found: ignore
      - name: Report build failure
        if: steps.build.outputs.exit_code != '0'
        working-directory: MikuMoe-v5
        run: |
          tail -n 300 build.log
          exit 1
      - name: Collect APK files
        run: |
          mkdir -p dist
          cp MikuMoe-v5/app/build/outputs/apk/debug/app-debug.apk dist/MikuMoe-v5-debug.apk
          cp MikuMoe-v5/app/build/outputs/apk/release/app-release.apk dist/MikuMoe-v5-release.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MikuMoe-v5-apks
          path: dist/*
          if-no-files-found: error
