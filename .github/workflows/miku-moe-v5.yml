name: Build Miku Moe v5

on:
  pull_request:
    branches:
      - global
    paths:
      - miku-moe-v5/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          git fetch origin agent/miku-moe-v2-build --depth=1
          git checkout FETCH_HEAD -- miku-moe-v2
          cat miku-moe-v2/source.part.00 miku-moe-v2/source.part.01 > source.tar.gz.b64
          head -c 1222 miku-moe-v2/source.part.02 >> source.tar.gz.b64
          tail -c +1224 miku-moe-v2/source.part.02 >> source.tar.gz.b64
          head -c 6703 miku-moe-v2/source.part.03 >> source.tar.gz.b64
          cat miku-moe-v2/source.part.03.tail >> source.tar.gz.b64
          cat miku-moe-v2/source.part.04 >> source.tar.gz.b64
          base64 --decode source.tar.gz.b64 > source.tar.gz
          echo "05eb7ff51a9ad6db584ffeef08e3d3df5a7fe969e9663326e6d3314cb079f433  source.tar.gz" | sha256sum --check
          tar -xzf source.tar.gz
          git fetch origin agent/miku-moe-v3-build --depth=1
          git checkout FETCH_HEAD -- miku-moe-v3/patch.part.00 miku-moe-v3/patch.part.01 miku-moe-v3/patch.part.02
          cat miku-moe-v3/patch.part.* > v3.patch.gz.b64
          echo "a7cd4d3227d785e45e934ab4512596c8a8346a78c5280558a793f9ddbe36d7a6  v3.patch.gz.b64" | sha256sum --check
          base64 --decode v3.patch.gz.b64 > v3.patch.gz
          gzip -dc v3.patch.gz > v3.patch
          cd MikuMoe-v2
          patch --batch -p5 < ../v3.patch
          cd ..
          git fetch origin agent/miku-moe-v4-build --depth=1
          git checkout FETCH_HEAD -- miku-moe-v4/patch.part.00 miku-moe-v4/patch.part.01 miku-moe-v4/patch.part.02
          cat miku-moe-v4/patch.part.* > v4.patch.gz.b64
          echo "c995e7f07ad4d480c6c0ea66e3febe0e74ffad8ab6833a1f74ee874841aafa33  v4.patch.gz.b64" | sha256sum --check
          base64 --decode v4.patch.gz.b64 > v4.patch.gz
          gzip -dc v4.patch.gz > v4.patch
          cd MikuMoe-v2
          patch --batch -p1 < ../v4.patch
          cd ..
          cat miku-moe-v5/patch.part.* > v5.patch.gz.b64
          echo "644b1321d1ce51814759883c97e60b67f020e21bc5963202a1fb0691342165fe  v5.patch.gz.b64" | sha256sum --check
          base64 --decode v5.patch.gz.b64 > v5.patch.gz
          echo "4d9796694d3866450622099136bd9e92a6420d29ce925e71fdef15c55f3f0b18  v5.patch.gz" | sha256sum --check
          gzip -dc v5.patch.gz > v5.patch
          cd MikuMoe-v2
          patch --batch -p1 < ../v5.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Generate release key
        run: keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass miku1234 -alias miku -keypass miku1234 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Miku Moe v2, OU=Android, O=Dutaeko, L=Jakarta, ST=Jakarta, C=ID" > /dev/null
      - name: Build APK files
        id: build
        working-directory: MikuMoe-v2
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: miku1234
          RELEASE_KEY_ALIAS: miku
          RELEASE_KEY_PASSWORD: miku1234
        run: |
          code=0
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain > build.log 2>&1 || code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MikuMoe-v5-build-log
          path: MikuMoe-v2/build.log
          if-no-files-found: error
      - name: Report build failure
        if: steps.build.outputs.exit_code != '0'
        working-directory: MikuMoe-v2
        run: |
          tail -n 300 build.log
          exit 1
      - name: Collect APK files
        run: |
          mkdir -p dist
          cp MikuMoe-v2/app/build/outputs/apk/debug/app-debug.apk dist/MikuMoe-v5-debug.apk
          cp MikuMoe-v2/app/build/outputs/apk/release/app-release.apk dist/MikuMoe-v5-release.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MikuMoe-v5-apks
          path: dist/*
          if-no-files-found: error
