name: Local Android Toolchain Cache
on:
  pull_request:
    branches:
      - global
jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Resolve dependencies
        id: resolve
        working-directory: seed
        run: |
          code=0
          gradle --no-daemon :app:assembleDebug :app:assembleRelease --stacktrace > ../seed-build.log 2>&1 || code=$?
          cat ../seed-build.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - name: Package toolchain
        if: steps.resolve.outputs.exit_code == '0'
        run: |
          gradle_bin="$(readlink -f "$(command -v gradle)")"
          gradle_root="$(dirname "$(dirname "$gradle_bin")")"
          mkdir -p bundle/android-sdk/build-tools bundle/android-sdk/platforms
          cp -a "$gradle_root" bundle/gradle
          cp -a "$HOME/.gradle" bundle/gradle-home
          cp -a "$ANDROID_HOME/build-tools/36.0.0" bundle/android-sdk/build-tools/
          cp -a "$ANDROID_HOME/platforms/android-36" bundle/android-sdk/platforms/
          cp -a "$ANDROID_HOME/licenses" bundle/android-sdk/
          rm -rf bundle/gradle-home/daemon bundle/gradle-home/workers
          tar -czf android-toolchain-cache.tar.gz -C bundle .
          sha256sum android-toolchain-cache.tar.gz > android-toolchain-cache.sha256
          split -b 350000000 -d -a 1 android-toolchain-cache.tar.gz android-toolchain-cache.part.
          ls -lh android-toolchain-cache.tar.gz android-toolchain-cache.part.*
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.exit_code == '0'
        with:
          name: android-toolchain-cache-part-0
          path: android-toolchain-cache.part.0
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.exit_code == '0'
        with:
          name: android-toolchain-cache-part-1
          path: android-toolchain-cache.part.1
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.exit_code == '0'
        with:
          name: android-toolchain-cache-part-2
          path: android-toolchain-cache.part.2
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.exit_code == '0'
        with:
          name: android-toolchain-cache-sha256
          path: android-toolchain-cache.sha256
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-toolchain-cache-log
          path: seed-build.log
          retention-days: 1
          if-no-files-found: error
      - name: Report dependency failure
        if: steps.resolve.outputs.exit_code != '0'
        run: exit 1
