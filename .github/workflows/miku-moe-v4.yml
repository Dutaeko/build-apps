name: Build Miku Moe v4

on:
  pull_request:
    branches:
      - global
    paths:
      - miku-moe-v4/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          echo "3985d7e736c40698f951de0cd1f368567cf663431bf24971f552061ec1462c2b  miku-moe-v4/source.tar.gz" | sha256sum --check
          tar -xzf miku-moe-v4/source.tar.gz
          cd MikuMoe-v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Generate release key
        run: keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass miku1234 -alias miku -keypass miku1234 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Miku Moe v2, OU=Android, O=Dutaeko, L=Jakarta, ST=Jakarta, C=ID" > /dev/null
      - name: Build APK files
        working-directory: MikuMoe-v4
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: miku1234
          RELEASE_KEY_ALIAS: miku
          RELEASE_KEY_PASSWORD: miku1234
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace --console=plain
      - name: Collect APK files
        run: |
          mkdir -p dist
          cp MikuMoe-v4/app/build/outputs/apk/debug/app-debug.apk dist/MikuMoe-v4-debug.apk
          cp MikuMoe-v4/app/build/outputs/apk/release/app-release.apk dist/MikuMoe-v4-release.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MikuMoe-v4-apks
          path: dist/*
          if-no-files-found: error